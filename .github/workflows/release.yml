name: CI & Cross-Platform Native Desktop Release (Windows / macOS / Linux)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Automated Security & Core Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --omit=dev --no-audit --no-fund
      - run: npm test

  build-desktop:
    name: Package Native Desktop (${{ matrix.label }})
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows-x64
            os: windows-latest
            target_arch: x64
            cmd: npm run build:win
          - label: macOS-arm64
            os: macos-latest
            target_arch: arm64
            cmd: npx electron-builder --mac dmg zip --arm64 --publish never
          - label: macOS-x64
            os: macos-latest
            target_arch: x64
            cmd: npx electron-builder --mac dmg zip --x64 --publish never
          - label: Linux-x64
            os: ubuntu-latest
            target_arch: x64
            cmd: npm run build:linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - name: Install exact architecture native Claude Code binary for macOS-x64
        if: matrix.label == 'macOS-x64'
        shell: bash
        run: |
          rm -rf node_modules/@anthropic-ai/claude-code-darwin-*
          npm install --no-save --force @anthropic-ai/claude-code-darwin-x64@2.1.323
      - name: Enforce executable bit & verify bundled native Claude Code binary
        shell: bash
        run: |
          BIN=$(ls node_modules/@anthropic-ai/claude-code-*/claude* | head -n1)
          if [ -z "$BIN" ] || [ ! -f "$BIN" ]; then
            echo "ERROR: Missing @anthropic-ai/claude-code platform binary!"
            exit 1
          fi
          if [ "${{ runner.os }}" != "Windows" ]; then
            chmod 755 "$BIN"
          fi
          ls -lh "$BIN"
      - run: ${{ matrix.cmd }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Verify unpacked native Claude Code inside packaged desktop app
        shell: bash
        run: |
          FOUND=$(find dist -path "*app.asar.unpacked*claude*" -type f -size +10M | head -n1)
          if [ -z "$FOUND" ]; then
            echo "ERROR: Packaged app.asar.unpacked is missing native Claude Code binary!"
            find dist -maxdepth 6
            exit 1
          fi
          ls -lh "$FOUND"
          if [ "${{ runner.os }}" != "Windows" ]; then
            if [ ! -x "$FOUND" ]; then
              echo "ERROR: Unpacked Claude binary is missing +x executable permission!"
              exit 1
            fi
          fi
          if [ "${{ matrix.label }}" = "macOS-x64" ]; then
            file "$FOUND"
            file "$FOUND" | grep -E "x86_64"
          else
            "$FOUND" --version
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: opencode-studio-${{ matrix.label }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            !dist/__uninstaller*
            !dist/*.blockmap
          if-no-files-found: ignore

  publish-release:
    name: Publish GitHub Release
    needs: build-desktop
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Determine release metadata
        id: meta
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "OpenCode Studio ${{ steps.meta.outputs.tag }}（全平台独立原生桌面版）"
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          body: |
            ## OpenCode Studio ${{ steps.meta.outputs.tag }} — 纯独立原生桌面客户端
            - **真正非网页版独立桌面架构**：一体化沉浸式原生窗口标题栏、专属应用图标、动态随机私有端口与进程级安全令牌隔离（外部浏览器无法访问）、硬件级渲染器沙盒、原生系统文件夹/另存为对话框与软件内一键下载更新。
            - **100% 开箱即用内置官方原生 Claude Code**：安装包已随包内置经过严格权限与架构校验的官方原生 Claude Code 内核（覆盖 Windows `x64`、macOS `arm64` Apple Silicon + `x64` Intel、Linux `x64`），**下载安装后直接可用，无需单独安装 Claude Code 或 Node.js**！
            - **安装向导版 vs 免安装便携版说明（Windows）**：
              - `OpenCode Studio Setup ...exe`（安装向导版，推荐日常主力使用）：支持自定义安装路径、创建桌面与开始菜单快捷方式、直接覆盖升级旧版并保留全部对话与供应商配置。
              - `OpenCode Studio ...exe`（免安装便携版）：单文件绿色运行，适合机房受限环境或随身 U 盘。
            - **macOS 首次打开提示放行**：Apple Silicon 选 `arm64.dmg`，Intel Mac 选 `x64.dmg`；首次打开若提示无法验证开发者，在终端运行一行命令即可：`xattr -cr "/Applications/OpenCode Studio.app"`
          files: release-artifacts/*
      - name: Keep only the latest official GitHub Release (preserve Git tags & never delete stable from pre-release)
        if: steps.meta.outputs.prerelease == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_TAG="${{ steps.meta.outputs.tag }}"
          OLD_TAGS=$(gh release list --repo "${{ github.repository }}" --limit 50 --json tagName,isPrerelease --jq '.[] | select(.isPrerelease == false) | .tagName' | grep -vxF "$CURRENT_TAG" || true)
          for t in $OLD_TAGS; do
            echo "Removing superseded release (preserving git tag): $t"
            gh release delete "$t" --repo "${{ github.repository }}" --yes || true
          done
