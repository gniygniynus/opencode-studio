name: CI & Cross-Platform Release (Windows / macOS / Linux)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_channel:
        description: "Release channel when manually building (none / stable / latest)"
        required: false
        default: "none"

permissions:
  contents: write

jobs:
  test:
    name: Automated Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --omit=dev --no-audit --no-fund
      - run: npm test

  build-desktop:
    name: Package Desktop (${{ matrix.label }})
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows-x64
            os: windows-latest
            cmd: npm run build:win
          - label: macOS-arm64
            os: macos-latest
            cmd: npm run build:mac
          - label: Linux-x64
            os: ubuntu-latest
            cmd: npm run build:linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Verify bundled native Claude Code binary
        shell: bash
        run: ls -lh node_modules/@anthropic-ai/claude-code-*/claude*
      - run: ${{ matrix.cmd }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Verify unpacked native Claude Code inside packaged output
        shell: bash
        run: |
          FOUND=$(find dist -path "*app.asar.unpacked*claude*" -type f -size +10M | head -n1)
          if [ -z "$FOUND" ]; then
            echo "ERROR: Packaged app.asar.unpacked is missing native Claude Code binary!"
            find dist -maxdepth 6
            exit 1
          fi
          ls -lh "$FOUND"
      - uses: actions/upload-artifact@v4
        with:
          name: opencode-studio-${{ matrix.label }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: ignore

  publish-release:
    name: Publish GitHub Release
    needs: build-desktop
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Determine channel (stable vs latest pre-release)
        id: meta
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "channel=latest (beta/pre-release)" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "channel=stable" >> "$GITHUB_OUTPUT"
          fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "OpenCode Studio ${{ steps.meta.outputs.tag }}"
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          body: |
            ## OpenCode Studio ${{ steps.meta.outputs.tag }}
            - **100% 开箱即用内置官方原生 Claude Code**：安装包已随包内置经过完整兼容验证的对应平台官方原生 Claude Code 内核，学生下载安装后直接可用，**无需单独安装 Claude Code 或 Node.js**！
            - **安装向导版 vs 免安装便携版说明（Windows）**：
              - `Setup.exe`（安装向导版，推荐主力使用）：支持自定义安装目录、自动创建桌面与开始菜单快捷方式、支持控制面板一键卸载。
              - 不带 `Setup` 的 `.exe`（免安装便携版）：单文件绿色版，无需管理员安装权限，双击直接运行（适合机房电脑或随身 U 盘）。
            - **macOS 首次打开提示解决**：在终端执行 `xattr -cr "/Applications/OpenCode Studio.app"` 后打开即可。
          files: release-artifacts/*
      - name: Keep only the latest GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_TAG="${{ steps.meta.outputs.tag }}"
          OLD_TAGS=$(gh release list --repo "${{ github.repository }}" --limit 50 --json tagName --jq '.[].tagName' | grep -vxF "$CURRENT_TAG" || true)
          for t in $OLD_TAGS; do
            echo "Removing superseded release & tag: $t"
            gh release delete "$t" --repo "${{ github.repository }}" --cleanup-tag --yes || true
          done
